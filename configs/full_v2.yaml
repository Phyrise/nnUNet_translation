  num_workers: 4

normalization:
  # H-02 (v2): extended from [-1000, 2000] to [-1024, 3071] to match
  # Dataset051 voxel range (max=3071 HU per plans). Prevents cortical bone
  # saturation. Effect on DICE_bone is [E] (pending Exp-A measurement).
  ct_clip_min: -1024
  ct_clip_max: 3071
  cbct_air_threshold: -900

slicing:
  num_adjacent: 3
  patch_size: [256, 256]

augmentation:
  rand_flip_prob: 0.5
  rand_affine_prob: 0.3
  rand_rotate_deg: 10
  rand_scale: 0.1
  rand_noise_prob: 0.2
  rand_noise_std: 0.05

model:
  spatial_dims: 2
  in_channels: 3
  out_channels: 1
  channels: [32, 64, 128, 256, 512]
  strides: [2, 2, 2, 2]
  num_res_units: 2
  dropout: 0.0

training:
  batch_size: 8
  num_epochs: 1000
  lr: 1.0e-4
  weight_decay: 1.0e-5
  loss: "l1"
  ssim_weight: 0.1
  amp: true
  seed: 42
  out_dir: "outputs/full_v2"
  log_every: 50
  val_every: 1
  save_every: 50      # save checkpoint_epoch_NNNN.pth every 50 epochs (in addition to best/last)

inference:
  sw_overlap: 0.5
  sw_batch_size: 4
